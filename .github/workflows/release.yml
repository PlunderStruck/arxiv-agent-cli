name: Release

# A release is one verified tarball published to npm and attached to GitHub.
# Build code runs without npm authority. The second job receives only the
# tarball and a short-lived OIDC identity bound to this workflow and environment.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: verify and build release artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          package-manager-cache: false

      - run: npm ci

      - name: Re-run the full gate against the tagged tree
        run: |
          npm run typecheck
          npm test

      - name: The tag must match the version the code reports
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          # A tag that disagrees with package.json produces a release whose
          # name and contents describe different builds.
          manifest=$(node -p "require('./package.json').version")
          case "$REF_NAME" in
            v*) tagged=${REF_NAME#v} ;;
            *)  tagged=$REF_NAME ;;
          esac
          if [ "$tagged" != "$manifest" ]; then
            echo "tag $REF_NAME does not match package.json version $manifest" >&2
            exit 1
          fi

      - name: Build the release tarball
        run: npm pack

      - name: Transfer the exact verified tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: "*.tgz"
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish npm and GitHub release
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Receive the verified tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: .

      - name: Publish the exact verified tarball to npm
        env:
          PACKAGE_NAME: arxiv-agent-cli
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          count=$(find . -maxdepth 1 -type f -name '*.tgz' | wc -l | tr -d ' ')
          if [ "$count" -ne 1 ]; then
            echo "expected exactly one release tarball, found $count" >&2
            exit 1
          fi

          tarball=$(find . -maxdepth 1 -type f -name '*.tgz' -print)
          version=${REF_NAME#v}
          expected=$(sha1sum "$tarball" | cut -d ' ' -f 1)

          if ! versions=$(npm view "$PACKAGE_NAME" versions --json); then
            echo "npm package does not exist; complete the documented bootstrap publish first" >&2
            exit 1
          fi

          if printf '%s' "$versions" | node -e '
            const versions = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            process.exit((Array.isArray(versions) ? versions : [versions]).includes(process.argv[1]) ? 0 : 1);
          ' "$version"; then
            published=$(npm view "$PACKAGE_NAME@$version" dist.shasum)
            if [ "$published" != "$expected" ]; then
              echo "$PACKAGE_NAME@$version already exists with different bytes" >&2
              exit 1
            fi
            echo "$PACKAGE_NAME@$version already contains the verified tarball; continuing"
          else
            npm publish "$tarball" --access public
          fi

      - name: Publish the same tarball as the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          tarball=$(find . -maxdepth 1 -type f -name '*.tgz' -print)
          if gh release view "$REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$REF_NAME" "$tarball" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$REF_NAME" "$tarball" \
              --title "$REF_NAME" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi
